<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Control Cam - Arcade</title>
    <!-- MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        h2 { margin: 5px 0; font-size: 1.2rem; }
        .setup-card { background: #1e1e1e; padding: 12px; border-radius: 10px; width: 100%; max-width: 400px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .form-group { display: flex; gap: 8px; margin-bottom: 8px; }
        input, select, button { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: white; font-size: 0.9rem; }
        input[type="text"] { flex: 1; }
        button { background: #007acc; font-weight: bold; cursor: pointer; border: none; }
        button:active { background: #005999; }
        .btn-iniciar { background: #28a745; width: 100%; font-size: 1.1rem; padding: 12px; margin-top: 5px; }
        .cam-container { position: relative; width: 100%; max-width: 400px; height: 240px; background: #000; border-radius: 10px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        .status { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; color: #00ffcc; }
    </style>
</head>
<body>

    <h2>Control Remoto por Cámara</h2>

    <div class="setup-card">
        <div class="form-group">
            <input type="text" id="ip" placeholder="IP PC (Ej: 192.168.0.150)">
            <select id="jugador">
                <option value="1">Jugador 1</option>
                <option value="2">Jugador 2</option>
            </select>
        </div>
        <div class="form-group">
            <select id="modo" style="width: 100%;">
                <option value="menu">Menú Principal</option>
                <option value="futbol">Fútbol</option>
                <option value="kickboxing">Kickboxing Punk</option>
                <option value="zombie">Zombies</option>
                <option value="squash">Squash</option>
            </select>
        </div>
        <button class="btn-iniciar" id="btnAccion" onclick="enviarAccionIniciar()">TOCÁ PARA INICIAR / ACCIÓN</button>
    </div>

    <div class="cam-container">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="status" id="status">Desconectado</div>
    </div>

    <script>
        let socket = null;
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusElement = document.getElementById('status');
        const ipInput = document.getElementById('ip');
        const jugadorSelect = document.getElementById('jugador');
        const modoSelect = document.getElementById('modo');

        // Cargar IP guardada si existe
        if (localStorage.getItem('godot_ip')) {
            ipInput.value = localStorage.getItem('godot_ip');
            conectarWebSocket();
        }

        ipInput.addEventListener('change', () => {
            localStorage.setItem('godot_ip', ipInput.value);
            conectarWebSocket();
        });

        function conectarWebSocket() {
            const ip = ipInput.value.trim();
            if (!ip) return;

            if (socket) socket.close();

            statusElement.innerText = "Conectando...";
            socket = new WebSocket(`ws://${ip}:8080`);

            socket.onopen = () => {
                statusElement.innerText = "✓ Conectado a Godot";
                statusElement.style.color = "#00ff66";
            };

            socket.onerror = () => {
                statusElement.innerText = "Error de conexión";
                statusElement.style.color = "#ff3333";
            };

            socket.onclose = () => {
                statusElement.innerText = "Desconectado";
                statusElement.style.color = "#ffaa00";
            };
        }

        function enviarAccionIniciar() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                const datos = {
                    comando: "ACCION_INICIAR",
                    jugador: parseInt(jugadorSelect.value),
                    modo: modoSelect.value
                };
                socket.send(JSON.stringify(datos));
            }
        }

        // MediaPipe Pose Detección
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({ image: videoElement });
            },
            width: 320,
            height: 240
        });
        camera.start();

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const lm = results.poseLandmarks;

                // Referencias
                const nariz = lm[0];
                const munecaDer = lm[16];
                const munecaIzq = lm[15];
                const tobilloDer = lm[28];
                const tobilloIzq = lm[27];
                const caderaDer = lm[24];
                const caderaIzq = lm[23];

                // Calculo Posicion X (Cuerpo)
                const posX = 1.0 - nariz.x; // Invertido por espejo

                // Distancia a la cámara (profundidad para Zombies)
                const anchoHombros = Math.abs(lm[11].x - lm[12].x);
                const distanciaCamara = Math.min(Math.max(anchoHombros * 2.5, 0.1), 1.0);

                // Detección Golpe (Mano extendida frente a la cámara o elevada)
                const golpe = (munecaDer.y < lm[12].y - 0.1) || (munecaIzq.y < lm[11].y - 0.1);

                // Detección Patada (Pie elevado cerca de la cadera)
                const caderaY = (caderaDer.y + caderaIzq.y) / 2.0;
                const patadaPie = (tobilloDer.y < caderaY + 0.15) || (tobilloIzq.y < caderaY + 0.15);

                // Patada Mano (Gesto especial para Fútbol)
                const patadaMano = (munecaDer.y < nariz.y) || (munecaIzq.y < nariz.y);

                // Salto (Cabeza/Nariz sube repentinamente)
                const salto = (nariz.y < 0.3);

                // Dirección Apuntado (Zombies)
                const dirApuntado = (munecaDer.x < nariz.x) ? 1.0 : -1.0;

                // Dibujar Puntos Clave
                canvasCtx.fillStyle = '#00ffcc';
                canvasCtx.beginPath();
                canvasCtx.arc(nariz.x * canvasElement.width, nariz.y * canvasElement.height, 5, 0, 2 * Math.PI);
                canvasCtx.fill();

                // Enviar Datos por WebSocket
                if (socket && socket.readyState === WebSocket.OPEN) {
                    const paquete = {
                        jugador: parseInt(jugadorSelect.value),
                        modo: modoSelect.value,
                        x: posX,
                        y: nariz.y,
                        distancia_camara: distanciaCamara,
                        golpe: golpe ? 1 : 0,
                        patada: patadaPie ? 1 : 0,
                        patada_mano: patadaMano ? 1 : 0,
                        salto: salto ? 1 : 0,
                        dir_apuntado: dirApuntado
                    };
                    socket.send(JSON.stringify(paquete));
                }
            }
            canvasCtx.restore();
        }
    </script>
</body>
</html>
