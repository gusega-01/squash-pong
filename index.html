<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlador Pong Sports</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 0;
            background-color: #121212; color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        #contenedor-camara {
            position: relative; width: 90vw; max-width: 640px; height: 38vh;
            border: 3px solid #333; border-radius: 10px; background-color: #000;
        }
        video { display: none; }
        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform: scaleX(-1);
        }
        #panel-control { 
            margin-top: 8px; text-align: center; width: 90vw; max-width: 640px; 
            display: flex; flex-direction: column; gap: 6px; align-items: center;
        }
        .fina-linea { display: flex; gap: 6px; justify-content: center; width: 100%; }
        input, select {
            padding: 8px; border-radius: 5px;
            border: 1px solid #555; background-color: #222; color: white; text-align: center;
            font-size: 13px;
        }
        input { width: 45%; }
        select { width: 45%; }
        button {
            padding: 10px 15px; background-color: #00ffcc; color: black;
            border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 90%;
        }
        #estado-conexion { font-size: 12px; color: #ff3333; }
    </style>
</head>
<body>

    <h3 style="margin: 5px 0;">CONTROL MULTIDEPORTES</h3>
    
    <div id="contenedor-camara">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="lienzo_dibujo"></canvas>
    </div>

    <div id="panel-control">
        <div class="fina-linea">
            <!-- MODO DE JUEGO -->
            <select id="selector-modo">
                <option value="squash">Squash Pong</option>
                <option value="box">Box Pong (Boxeo)</option>
            </select>
            <!-- JUGADOR -->
            <select id="selector-jugador">
                <option value="1">Jugador 1 (Rojo/Azul)</option>
                <option value="2">Jugador 2 (Naranja)</option>
            </select>
        </div>

        <div class="fina-linea">
            <select id="selector-camara" onchange="cambiarCamara()">
                <option value="">Cargando cámaras...</option>
            </select>
            <input type="text" id="ip_tv" value="192.168.100.7" placeholder="IP TV">
        </div>
        
        <button onclick="conectarWebSocket()">Conectar a TV</button>
        <div id="estado-conexion">Desconectado</div>
    </div>

<script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('lienzo_dibujo');
    const canvasCtx = canvasElement.getContext('2d');
    const estadoConexion = document.getElementById('estado-conexion');
    const selectorCamara = document.getElementById('selector-camara');
    const selectorJugador = document.getElementById('selector-jugador');
    const selectorModo = document.getElementById('selector-modo');
    
    let ws = null;
    let cameraInstance = null;
    let wakeLock = null;
    let ultimosLandmarks = null;

    const FACTOR_SENSIBILIDAD_X = 2.5;
    let posXFiltrada = 0.5;

    async function activarPantallaEncendida() {
        try {
            if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {}
    }

    async function listarCamaras() {
        try {
            await navigator.mediaDevices.getUserMedia({ video: true });
            const dispositivos = await navigator.mediaDevices.enumerateDevices();
            const videoDispositivos = dispositivos.filter(d => d.kind === 'videoinput');
            
            selectorCamara.innerHTML = '';
            videoDispositivos.forEach((dispositivo, i) => {
                const opcion = document.createElement('option');
                opcion.value = dispositivo.deviceId;
                opcion.text = dispositivo.label || `Cámara ${i + 1}`;
                selectorCamara.appendChild(opcion);
            });

            if (videoDispositivos.length > 0) iniciarCamara(videoDispositivos[0].deviceId);
        } catch (e) {}
    }

    function cambiarCamara() {
        if (selectorCamara.value) iniciarCamara(selectorCamara.value);
    }

    function iniciarCamara(deviceId) {
        if (cameraInstance) cameraInstance.stop();
        cameraInstance = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: 640, height: 480, deviceId: deviceId
        });
        cameraInstance.start();
    }

    function conectarWebSocket() {
        const ipTV = document.getElementById('ip_tv').value.trim();
        if(!ipTV) return alert("Ingresá la IP de la TV");

        activarPantallaEncendida();
        estadoConexion.innerText = "Conectando a " + ipTV + "...";
        estadoConexion.style.color = "#ffcc00";

        ws = new WebSocket("ws://" + ipTV + ":8080");

        ws.onopen = () => {
            estadoConexion.innerText = "¡Conectado como J" + selectorJugador.value + " (" + selectorModo.value.toUpperCase() + ")!";
            estadoConexion.style.color = "#00ff00";
        };

        ws.onclose = () => {
            estadoConexion.innerText = "Conexión cerrada.";
            estadoConexion.style.color = "#ff3333";
        };
    }

    const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    function onResults(results) {
        canvasElement.width = canvasElement.clientWidth;
        canvasElement.height = canvasElement.clientHeight;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.fillStyle = "#000000";
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.poseLandmarks) {
            const p = results.poseLandmarks;
            const hombroIzq = p[11], hombroDer = p[12];
            const muñecaDer = p[16], muñecaIzq = p[15];
            const tobilloDer = p[28], tobilloIzq = p[27];
            const caderaDer = p[24], caderaIzq = p[23];

            // Posición X e Y del torso
            const centroX_Bruto = 1.0 - ((hombroIzq.x + hombroDer.x) / 2);
            let posX_Calculada = 0.5 + (centroX_Bruto - 0.5) * FACTOR_SENSIBILIDAD_X;
            posX_Calculada = Math.max(0.0, Math.min(1.0, posX_Calculada));
            posXFiltrada = posXFiltrada + (posX_Calculada - posXFiltrada) * 0.3;

            const anchoHombros = Math.hypot(hombroIzq.x - hombroDer.x, hombroIzq.y - hombroDer.y);
            let posY = 1.0 - Math.min(Math.max((anchoHombros - 0.10) / 0.25, 0), 1);

            // DETECCIÓN DE PIÑAS Y PATADAS
            let golpedia = 0; // 0: Ninguno, 1: Piña Mano Derecha, 2: Piña Mano Izq
            let patada = 0;   // 0: Ninguna, 1: Patada Derecha, 2: Patada Izquierda

            // Detección de piña (Muñecas extendidas por delante del torso o por encima del hombro)
            if (muñecaDer.y < hombroDer.y || Math.abs(muñecaDer.x - hombroDer.x) > 0.25) golpedia = 1;
            if (muñecaIzq.y < hombroIzq.y || Math.abs(muñecaIzq.x - hombroIzq.x) > 0.25) golpedia = 2;

            // Detección de patada (Tobillos levantados respecto a la cadera)
            const caderaMediaY = (caderaDer.y + caderaIzq.y) / 2;
            if (tobilloDer.y < caderaMediaY + 0.15) patada = 1;
            if (tobilloIzq.y < caderaMediaY + 0.15) patada = 2;

            // Dibujo de silueta básica en la pantalla del celular
            const drawX = posXFiltrada * canvasElement.width;
            const drawY = canvasElement.height / 2;
            canvasCtx.strokeStyle = selectorJugador.value === "1" ? "#ff3333" : "#ff9900";
            canvasCtx.lineWidth = 4;
            canvasCtx.beginPath();
            canvasCtx.arc(drawX, drawY - 30, 15, 0, 2 * Math.PI);
            canvasCtx.moveTo(drawX, drawY - 15);
            canvasCtx.lineTo(drawX, drawY + 30);
            canvasCtx.stroke();

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    modo: selectorModo.value,
                    jugador: parseInt(selectorJugador.value),
                    x: Number(posXFiltrada.toFixed(3)),
                    y: Number(posY.toFixed(3)),
                    golpe: golpedia,
                    patada: patada
                }));
            }
        }
        canvasCtx.restore();
    }

    listarCamaras();
</script>
</body>
</html>
